[package]
name = "aicontext"
version = "0.6.0"
edition = "2021"
description = "Deterministic repository intelligence CLI (P0 core)"
license = "MIT"
repository = "https://github.com/JhonMA82/AiContext"

[[bin]]
name = "aicontext"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "help", "usage"] }
clap_complete = "=4.6.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
serde_yaml = "=0.9.34"
ignore = "=0.4.24"
anyhow = "=1.0.100"
thiserror = "=2.0.17"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
